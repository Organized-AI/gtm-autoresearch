<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}[hidden]{display:none!important}</style></head><body><title>Container Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
/* Drift history: one column; each daily check is a row, changes listed under the day they appeared. */
:root{color-scheme:dark;--bg:#0c0b09;--panel:#15130f;--ink:#f7f2df;--muted:#a69f8b;--dim:#5d574a;--line:#353025;--gold:#ffe94a;--crit:#ff625f;--pass:#5ce1a4;--amber:#ffad58;--mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono)}
main{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:48px 72px}
.eyebrow{margin:0;color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(22px,4.5vw,32px);margin:8px 0 6px;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
button{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msg{font-size:12px;color:var(--muted);min-height:1.4em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 26px}
.stat{border:1px solid var(--line);border-radius:6px;padding:12px}
.stat span{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.check{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
.when{font-size:11px;color:var(--muted)}.when b{display:block;color:var(--ink);font-size:12px}
.ok{font-size:12px;color:var(--pass)}.err{font-size:12px;color:var(--crit)}
ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
li{font-size:12px;line-height:1.5;padding-left:10px;border-left:2px solid var(--gold);overflow-wrap:anywhere}
li.critical{border-color:var(--crit)}li.info{border-color:var(--dim);color:var(--muted)}
li.new::after{content:"new";margin-left:8px;font-size:9px;color:#111;background:var(--gold);padding:1px 5px;border-radius:3px}
.empty{color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:560px){.check{grid-template-columns:1fr}}
</style>
<main>
 <p class="eyebrow">Container drift</p>
 <h1 id="title">Loading…</h1>
 <p class="sub" id="sub"></p>
 <div class="bar"><button class="primary" id="check" type="button">Check now</button><button id="stop" type="button">Stop watching</button><a href="/" style="align-self:center;font-size:12px;color:var(--gold)">New audit</a></div>
 <p class="msg" id="msg" aria-live="polite"></p>
 <p class="sub">When the published container drifts from the baseline, run <a href="https://github.com/Organized-AI/gtm-autoresearch" target="_blank" rel="noopener" style="color:var(--gold)">GTM Autoresearch</a> on the new version to re-score it and get a guarded cleanup proposal.</p>
 <div class="stats" id="stats"></div>
 <section id="list"></section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), id = q.get('w'), t = q.get('t');
  const api = (path, opts) => fetch('/api/watch/' + encodeURIComponent(id) + (path || '') + '?t=' + encodeURIComponent(t), opts).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.message || 'Request failed'); return j; });
  const fmt = ms => new Date(ms).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  let stopArmed = false;
  function render(h) {
    $('title').textContent = (h.label || h.publicId) + ' · ' + h.publicId;
    $('sub').textContent = 'Baseline: exported version ' + (h.baselineVersion || '?') + (h.website ? ' for ' + h.website : '') + '. Checked daily against the published container. Watching since ' + fmt(h.createdAt) + '.';
    const last = h.checks[0] || {}, stats = $('stats'); stats.textContent = '';
    [['Published version', last.version || '—'], ['Differences from baseline', (last.changes || []).length], ['Checks run', h.checks.length]].forEach(([a, b]) => { const d = document.createElement('div'); d.className = 'stat'; const s = document.createElement('span'); s.textContent = a; const v = document.createElement('b'); v.textContent = b; d.append(s, v); stats.append(d); });
    const list = $('list'); list.textContent = '';
    if (!h.checks.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'No checks yet.'; list.append(p); return; }
    h.checks.forEach((c, i) => {
      const row = document.createElement('div'); row.className = 'check';
      const w = document.createElement('div'); w.className = 'when'; const b = document.createElement('b'); b.textContent = fmt(c.checkedAt); w.append(b, document.createTextNode(c.version ? 'version ' + c.version : '')); row.append(w);
      const body = document.createElement('div');
      if (c.error) { const e = document.createElement('p'); e.className = 'err'; e.textContent = c.error; body.append(e); }
      else if (!c.changes.length) { const o = document.createElement('p'); o.className = 'ok'; o.textContent = 'Matches the baseline.'; body.append(o); }
      else {
        const fresh = new Set((i === h.checks.length - 1 ? [] : c.newChanges).map(x => x.message));
        const ul = document.createElement('ul');
        c.changes.forEach(x => { const li = document.createElement('li'); li.className = x.severity + (fresh.has(x.message) ? ' new' : ''); li.textContent = x.message; ul.append(li); });
        body.append(ul);
      }
      row.append(body); list.append(row);
    });
  }
  if (!id || !t) { $('title').textContent = 'This drift link is incomplete'; $('sub').textContent = 'Open the link the atlas gave you when you started watching, including everything after the question mark.'; $('check').hidden = $('stop').hidden = true; return; }
  api().then(render).catch(e => { $('title').textContent = 'Drift history not found'; $('sub').textContent = e.message; $('check').hidden = $('stop').hidden = true; });
  $('check').onclick = () => { $('msg').textContent = 'Fetching the published container…'; api('/check', { method: 'POST' }).then(h => { render(h); $('msg').textContent = 'Checked just now.'; }).catch(e => { $('msg').textContent = e.message; }); };
  $('stop').onclick = () => {
    if (!stopArmed) { stopArmed = true; $('stop').textContent = 'Click again to stop watching'; $('msg').textContent = 'This deletes the baseline and every check for this container.'; return; }
    api('', { method: 'DELETE' }).then(() => { $('title').textContent = 'No longer watching'; $('stats').textContent = ''; $('list').textContent = ''; $('msg').textContent = 'The baseline and its history were deleted.'; $('check').hidden = $('stop').hidden = true; }).catch(e => { $('msg').textContent = e.message; });
  };
})();
</script>
</body></html>
