<title>GTM Auto Runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
/* Drift history: one column; each daily check is a row, changes listed under the day they appeared. */
:root{color-scheme:dark;--bg:#0c0b09;--panel:#15130f;--ink:#f7f2df;--muted:#a69f8b;--dim:#5d574a;--line:#353025;--gold:#ffe94a;--crit:#ff625f;--pass:#5ce1a4;--amber:#ffad58;--mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono)}
main{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:48px 72px}
.eyebrow{margin:0;color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(22px,4.5vw,32px);margin:8px 0 6px;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
button{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msg{font-size:12px;color:var(--muted);min-height:1.4em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 26px}
.stat{border:1px solid var(--line);border-radius:6px;padding:12px}
.stat span{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.check{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
.when{font-size:11px;color:var(--muted)}.when b{display:block;color:var(--ink);font-size:12px}
.ok{font-size:12px;color:var(--pass)}.err{font-size:12px;color:var(--crit)}
ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
li{font-size:12px;line-height:1.5;padding-left:10px;border-left:2px solid var(--gold);overflow-wrap:anywhere}
li.critical{border-color:var(--crit)}li.info{border-color:var(--dim);color:var(--muted)}
li.new::after{content:"new";margin-left:8px;font-size:9px;color:#111;background:var(--gold);padding:1px 5px;border-radius:3px}
.empty{color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:560px){.check{grid-template-columns:1fr}}
.ops{margin-top:6px;font-size:11px;color:var(--muted)}.ops summary{cursor:pointer}.ops pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:10.5px;margin:6px 0 0;color:var(--ink)}
.acc{color:var(--pass)}.rej{color:var(--muted)}
</style>
<main>
 <p class="eyebrow">GTM auto · run history</p>
 <h1 id="title">Loading…</h1>
 <p class="sub" id="sub"></p>
 <div class="bar"><button id="dl" type="button">Download rounds (JSON)</button><a href="https://github.com/Organized-AI/gtm-autoresearch" target="_blank" rel="noopener" style="align-self:center;font-size:12px;color:var(--gold)">GTM Autoresearch</a><a href="/" style="align-self:center;font-size:12px;color:var(--gold)">New audit</a></div>
 <p class="msg" id="msg" aria-live="polite"></p>
 <div class="stats" id="stats"></div>
 <section id="list"></section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), id = q.get('r'), t = q.get('t');
  const fmt = ms => new Date(ms).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  if (!id || !t) { $('title').textContent = 'This run link is incomplete'; $('sub').textContent = 'Open the link the atlas gave you, including everything after the question mark.'; $('dl').hidden = true; return; }
  fetch('/api/runs/' + encodeURIComponent(id) + '?t=' + encodeURIComponent(t)).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.message); return j; }).then(run => {
    $('title').textContent = 'GTM auto · ' + run.publicId;
    $('sub').textContent = (run.website ? run.website + ' · ' : '') + 'Started ' + fmt(run.createdAt) + '. Every round is stored, accepted or rejected, with its operations and scores. Nothing here was published.';
    const acc = run.rounds.filter(r => r.accepted).length, stats = $('stats');
    [['Baseline score', run.baselineScore ?? '—'], ['Best score', run.bestScore ?? '—'], ['Rounds', run.rounds.length], ['Accepted', acc]].forEach(([a, b]) => { const d = document.createElement('div'); d.className = 'stat'; const s = document.createElement('span'); s.textContent = a; const v = document.createElement('b'); v.textContent = b; d.append(s, v); stats.append(d); });
    const list = $('list');
    if (!run.rounds.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'No rounds yet. Run the loop in the GTM auto tab.'; list.append(p); }
    run.rounds.forEach(r => {
      const row = document.createElement('div'); row.className = 'check';
      const w = document.createElement('div'); w.className = 'when'; const b = document.createElement('b'); b.textContent = 'Round ' + r.round; w.append(b, document.createTextNode(fmt(r.createdAt) + ' · ' + (r.source || ''))); row.append(w);
      const body = document.createElement('div');
      const h = document.createElement('p'); h.className = r.accepted ? 'acc' : 'rej'; h.style.margin = '0'; h.style.fontSize = '12px'; h.textContent = (r.accepted ? 'Accepted' : 'Rejected') + (r.score != null ? ' · score ' + r.score : '') + ' · ' + (r.reason || ''); body.append(h);
      if (r.why) { const y = document.createElement('p'); y.style.margin = '4px 0 0'; y.style.fontSize = '11.5px'; y.style.color = 'var(--muted)'; y.textContent = r.why; body.append(y); }
      const det = document.createElement('details'); det.className = 'ops'; const sm = document.createElement('summary'); sm.textContent = r.operations.length + ' operations'; const pre = document.createElement('pre'); pre.textContent = JSON.stringify(r.operations, null, 2); det.append(sm, pre); body.append(det);
      row.append(body); list.append(row);
    });
    $('dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(run, null, 2)], { type: 'application/json' })); a.download = run.publicId + '-gtm-auto-run.json'; document.body.append(a); a.click(); a.remove(); };
  }).catch(e => { $('title').textContent = 'Run not found'; $('sub').textContent = e.message; $('dl').hidden = true; });
})();
</script>
