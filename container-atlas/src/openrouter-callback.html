<title>OpenRouter connected</title>
<main style="font-family:ui-monospace,Menlo,monospace;background:#0c0b09;color:#f7f2df;min-height:100vh;display:grid;place-items:center;padding:16px;text-align:center">
 <p id="m" style="font-size:13px;color:#a69f8b">Finishing sign-in…</p>
</main>
<script>
(() => {
  const code = new URLSearchParams(location.search).get('code'), m = document.getElementById('m');
  if (!code) { m.textContent = 'No sign-in code came back from OpenRouter. Close this window and try again.'; return; }
  try { localStorage.setItem('atlas-openrouter-code', code); } catch (e) { /* storage blocked */ }
  try { const ch = new BroadcastChannel('atlas-openrouter'); ch.postMessage({ code }); ch.close(); } catch (e) { /* older browser: storage fallback */ }
  m.textContent = 'Connected. You can close this window.';
  setTimeout(() => window.close(), 400);
})();
</script>
